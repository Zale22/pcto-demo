services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_NAME: pcto_db
      DB_USER: pcto
      DB_PASSWORD: ${DB_PASSWORD:?Imposta DB_PASSWORD in Dokploy}
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      MARIADB_DATABASE: pcto_db
      MARIADB_USER: pcto
      MARIADB_PASSWORD: ${DB_PASSWORD:?Imposta DB_PASSWORD in Dokploy}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Imposta DB_ROOT_PASSWORD in Dokploy}
    volumes:
      - pcto_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pcto_db_data:
